<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doll fit lab</title>
<!-- Fit-calibration contact sheets. Serve the repo root (e.g. python3 -m http.server 4190) and open
     /art/lab.html?sheet=outfits|hair|shoes|jewelry|makeup|haircolors|tints|looks|one
     Extra params: doll=adult|little, zoom=x,y,w,h (doll-local crop), scale=n, grid=step,
     look={json overrides}, ids=a,b (filter). window.labDone is set when drawing finishes.
     View sheets (side/back calibration): sheet=vout|vhair|vshoes|vjewel|vclips|vcolors|vtints|vmakeup|turn|walk
     with views=left,right,back (default all three; vout/vhair also take front), zoom is then in the
     doll-local px of each view's own base picture. turn = four-view turnarounds of mixed looks. -->
<base href="/dist/">
<style>
body{margin:0;background:#2d2633;color:#fff;font:12px/1.3 system-ui,sans-serif}
.sheet{display:flex;flex-wrap:wrap;gap:6px;padding:6px}
figure{margin:0;background:#cfe6d4;border-radius:4px;overflow:hidden}
figcaption{background:#1c1820;padding:3px 5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas{display:block}
h2{margin:8px 8px 0;font-size:14px}
</style>
</head>
<body>
<div id="out"></div>
<script src="i18n.js"></script>
<script src="hair-fit.js"></script>
<script src="catalog.js"></script>
<script src="island-life.js"></script>
<script src="portrait.js"></script>
<script>
const q=new URLSearchParams(location.search);
/* Lab-only placeholder hair (an empty sprite) so outfits can be judged without hair in the way. */
{const blank='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==';
 const it={id:'lab-none',name:'(lab: no hair)',category:'hair',dolls:['adult','little'],price:0,tints:[{id:'original'}],art:{front:{main:blank}},
  fit:{adult:{front:{x:0,y:0,w:1,h:1,clip:{x:170,y:30}}},little:{front:{x:0,y:0,w:1,h:1,clip:{x:160,y:60}}}}};
 for(const v of ['left','right','back']){it.art[v]=it.art.front;for(const d of ['adult','little'])it.fit[d][v]={x:0,y:0,w:1,h:1,clip:{x:60,y:30,hide:true}}}
 CATALOG.items[it.id]=it;CATALOG.itemList.push(it);}
/* noscalp=1: hair styles without the scalp shown through partings (portrait.js scalpShow), to compare against the sprite alone. */
if(q.get('noscalp'))for(const it of CATALOG.itemList)if(it.category==='hair')for(const d in it.fit)for(const v in it.fit[d])it.fit[d][v].scalp=false;
/* nounder=1: covered-ear styles without the hair behind the head (portrait.js underHair). */
if(q.get('nounder'))for(const it of CATALOG.itemList)if(it.category==='hair')for(const d in it.fit)if(it.fit[d].front)delete it.fit[d].front.under;
/* noopen=1: the styles without openFace (portrait.js), to see what the art alone covers. */
if(q.get('noopen'))for(const it of CATALOG.itemList)if(it.category==='hair')for(const d in it.fit)if(it.fit[d].front)delete it.fit[d].front.open;
if(q.get('noshade'))for(const it of CATALOG.itemList)if(it.category==='hair')for(const d in it.fit)for(const v in it.fit[d])it.fit[d][v].shade=false;
/* nudge=id:doll:view:dx:dy[:k[:ax:ay]],... tries a hair correction before writing it into HAIR_TUNE (k scales
   about doll point ax,ay, default the fit's centre). */
for(const n of (q.get('nudge')||'').split(',').filter(Boolean)){const [id,d,v,dx,dy,k=1,ax,ay]=n.split(':');const f=CATALOG.items[id].fit[d][v];
  const cx=ax===undefined?f.x+f.w/2:+ax,cy=ay===undefined?f.y+f.h/2:+ay;f.x=cx+(f.x-cx)*k+(+dx);f.y=cy+(f.y-cy)*k+(+dy);f.w*=+k;f.h*=+k;}
const out=document.querySelector('#out');
const sheetName=q.get('sheet')||'outfits';
const only=q.get('ids')?q.get('ids').split(','):null;
let section=null;
function heading(t){const h=document.createElement('h2');h.textContent=t;out.append(h);section=document.createElement('div');section.className='sheet';out.append(section)}
/* Render a look cropped to a doll-local box. */
async function tile(label,look,{zoom,scale=1,grid=0,bg=q.get('bg')||'#cfe6d4',view='front',overlay}={}){
  const doll=look.doll;const [ox,oy]=dollView(doll,view).origin;
  const c=await composeDoll(look,view);
  const [x,y,w,h]=zoom||[-100,-140,600,1050];
  const t=document.createElement('canvas');t.width=Math.round(w*scale);t.height=Math.round(h*scale);
  const g=t.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,t.width,t.height);
  g.imageSmoothingEnabled=scale<2.5;g.imageSmoothingQuality='high';
  g.drawImage(c,x+ox,y+oy,w,h,0,0,t.width,t.height);
  if(grid){
    g.font='10px monospace';
    for(let gx=Math.ceil(x/grid)*grid;gx<x+w;gx+=grid){const X=(gx-x)*scale;g.strokeStyle=gx%(grid*5)?'rgba(0,0,255,.25)':'rgba(255,0,0,.5)';g.beginPath();g.moveTo(X+.5,0);g.lineTo(X+.5,t.height);g.stroke();g.fillStyle='#002';g.fillText(gx,X+2,10)}
    for(let gy=Math.ceil(y/grid)*grid;gy<y+h;gy+=grid){const Y=(gy-y)*scale;g.strokeStyle=gy%(grid*5)?'rgba(0,0,255,.25)':'rgba(255,0,0,.5)';g.beginPath();g.moveTo(0,Y+.5);g.lineTo(t.width,Y+.5);g.stroke();g.fillStyle='#002';g.fillText(gy,2,Y-2)}
  }
  if(overlay){g.save();g.scale(scale,scale);g.translate(-x,-y);overlay(g,scale);g.restore()}
  const f=document.createElement('figure');const cap=document.createElement('figcaption');cap.textContent=label;cap.style.width=t.width-10+'px';
  f.append(t,cap);section.append(f);
}
const L=(doll,o={})=>({...defaultLook(doll),doll,...(q.get('nohair')?{hair:'lab-none',earrings:'none',clip:'none'}:{}),...o});
const extra=q.get('look')?JSON.parse(q.get('look')):{};
const dolls=q.get('doll')?[q.get('doll')]:['adult','little'];
const zoom=q.get('zoom')?q.get('zoom').split(',').map(Number):null;
const scale=Number(q.get('scale')||(zoom?2:.5));
const grid=Number(q.get('grid')||0);
const opt={zoom,scale,grid};
const want=id=>!only||only.includes(id);
const sheets={
  async outfits(){for(const d of dolls){heading('Outfits · '+d);for(const it of catalogOptions('outfit',d))if(want(it.id))await tile(it.id,L(d,{outfit:it.id,shoes:q.get('shoes')||'none',necklace:'none',...extra}),opt)}},
  async hair(){for(const d of dolls){heading('Hair · '+d);for(const it of CATALOG.itemList.filter(i=>i.category==='hair'&&i.id!=='lab-none'))if(want(it.id))await tile(it.id+(it.fit[d]?'':' (no fit)'),L(d,{hair:it.fit[d]?it.id:defaultLook(d).hair,...extra}),{scale:zoom?scale:1,zoom:zoom||(d==='adult'?[60,-60,280,420]:[40,-40,320,460]),grid})}},
  async shoes(){for(const d of dolls){heading('Shoes · '+d);for(const id of ['none',...catalogOptions('shoes',d).map(i=>i.id)])if(want(id))await tile(id,L(d,{shoes:id,outfit:q.get('outfit')||defaultLook(d).outfit,...extra}),{scale:zoom?scale:1.4,zoom:zoom||(d==='adult'?[80,720,240,180]:[70,700,260,190]),grid})}},
  async jewelry(){for(const d of dolls){heading('Jewelry · '+d);
    for(const id of ['none',...catalogOptions('earrings',d).map(i=>i.id)])if(want(id))for(const t of id==='none'?[original0]:tintOptions(id))await tile('earrings '+id+' '+t.id,L(d,{earrings:id,earringsTint:t.id,necklace:'none',...extra}),{scale:zoom?scale:1.6,zoom:zoom||(d==='adult'?[120,40,160,140]:[100,80,210,170]),grid});
    for(const id of ['none',...catalogOptions('necklace',d).map(i=>i.id)])if(want(id))await tile('necklace '+id,L(d,{necklace:id,...extra}),{scale:zoom?scale:1.4,zoom:zoom||(d==='adult'?[110,120,180,190]:[100,170,200,200]),grid});
    for(const id of ['none',...catalogOptions('clip',d).map(i=>i.id)])if(want(id))await tile('clip '+id,L(d,{clip:id,...extra}),{scale:zoom?scale:1,zoom:zoom||(d==='adult'?[80,-60,240,220]:[60,-40,280,240]),grid});
  }},
  async makeup(){for(const d of dolls){const fz=d==='adult'?[150,55,110,95]:[125,95,160,110];heading('Makeup · '+d);
    for(const f of ['lips','blush','shadow','gem','nails'])for(const o of makeupOptions(f,d)){if(o.id==='none'&&f!=='lips')continue;
      const look=L(d,{lips:'none',blush:'none',shadow:'none',gem:'none',nails:'none',[f]:o.id,...extra});
      if(f==='nails'){await tile('nails '+o.id,{...look,shoes:'none'},{scale:4,zoom:[340,490,50,60]});await tile('toes '+o.id,{...look,shoes:'none'},{scale:3,zoom:[105,840,190,30]});continue}
      await tile(f+' '+o.id+' 1x',look,{scale:.5,zoom:d==='adult'?[110,20,180,180]:[100,40,200,200]});
      await tile(f+' '+o.id+' zoom',look,{scale:3,zoom:fz});}}},
  async haircolors(){for(const d of dolls){heading('Hair colours · '+d);for(const hc of CATALOG.hairColors)for(const h of (q.get('hair')||'long-waves,curly-bob').split(','))await tile(h+' '+hc.id,L(d,{hair:h,hairColor:hc.id,...extra}),{scale:.8,zoom:d==='adult'?[60,-60,280,420]:[40,-40,320,460]})}},
  async tints(){for(const d of dolls){heading('Tints · '+d);
    for(const cat of ['outfit','shoes'])for(const it of catalogOptions(cat,d))if(want(it.id))for(const t of it.tints)if(t.id!=='original'||q.get('orig'))await tile(it.id+' · '+t.id,L(d,{[cat]:it.id,[cat+'Tint']:t.id,...extra}),{scale:cat==='shoes'?1:.42,zoom:cat==='shoes'?(d==='adult'?[80,720,240,180]:[70,700,260,190]):null})}},
  async looks(){heading('Looks on backdrops');const looks=JSON.parse(q.get('looks')||'null')||[
      L('adult'),L('little'),
      L('adult',{outfit:'lilac-satin-bow-dress',hair:'half-up-curls',hairColor:'honey',shoes:'lilac-mary-jane-heels',necklace:'butterfly-necklace',clip:'butterfly-clip',lips:'bubblegum',shadow:'pink',gem:'glitter',nails:'bubblegum',backdrop:1}),
      L('little',{outfit:'denim-overalls',hair:'curly-buns',shoes:'white-velcro-sneakers',clip:'none',gem:'heart',blush:'peach',backdrop:2}),
      L('adult',{outfit:'denim-jacket-skirt',hair:'side-ponytail',hairColor:'bubblegum',shoes:'pink-chunky-sneakers',earrings:'star-studs',necklace:'none',clip:'gold-star',lips:'cherry',shadow:'lilac',backdrop:3}),
      L('little',{outfit:'star-pajamas',hair:'curly-bob',hairColor:'strawberry',shoes:'strawberry-rain-boots',clip:'butterfly-clip',lips:'strawberry-tint',gem:'star-freckles',backdrop:0}),
      L('adult',{outfit:'black-flares-set',hair:'curly-bob',hairColor:'jet',shoes:'black-platform-sandals',earrings:'gold-hoops',earringsTint:'silver',clip:'red-bow',lips:'berry',shadow:'bronze',backdrop:2}),
      L('little',{outfit:'mint-cardigan-dress',hair:'curly-bob',hairColor:'honey',shoes:'red-mary-janes',shoesTint:'original',clip:'hibiscus-clip',gem:'glitter',backdrop:1}),
      L('adult',{outfit:'pink-velour-cargo',outfitTint:'lilac',hair:'ringlet-pigtails',hairColor:'lilac',shoes:'pink-chunky-sneakers',clip:'peach-blossom',gem:'crystals',lips:'peach-gloss',shadow:'aqua',backdrop:0}),
      L('little',{outfit:'lilac-cord-pinafore',hair:'curly-buns',shoes:'white-velcro-sneakers',clip:'satin-bow',earrings:'pearl-studs',gem:'butterfly',backdrop:3}),
      L('adult',{outfit:'green-hibiscus-sundress',hair:'long-waves',hairColor:'chestnut',shoes:'lilac-mary-jane-heels',necklace:'butterfly-necklace',earrings:'heart-studs',clip:'hibiscus-clip',lips:'rose-nude',blush:'rose',backdrop:1})];
    for(const look of looks){const c=document.createElement('canvas');await paintPortrait(c,look,q.get('postcard')==='1');c.style.width=(c.width*scale)+'px';const f=document.createElement('figure');const cap=document.createElement('figcaption');cap.textContent=look.doll+' '+look.outfit+' bd'+look.backdrop;f.append(c,cap);section.append(f)}},
  async parts(){for(const d of dolls){heading('Limb parts · '+d);for(const it of catalogOptions('outfit',d)){if(!want(it.id))continue;
    const fit=it.fit[d].front;await tile(it.id,L(d,{outfit:it.id,shoes:'none',necklace:'none',...extra}),{...opt,zoom:zoom||[-40,150,480,420],scale:zoom?scale:1});
    const t=section.lastChild.querySelector('canvas'),g=t.getContext('2d');const [zx,zy]=zoom||[-40,150];const sc=zoom?scale:1;
    g.save();g.scale(sc,sc);g.translate(-zx,-zy);g.lineWidth=1.5/sc;
    for(const pc of fit.pieces)for(const p of pc.parts||[]){
      g.save();g.translate(p.to[0],p.to[1]);g.rotate(p.rot*Math.PI/180);g.scale(p.scale[0],p.scale[1]);g.translate(-p.pivot[0],-p.pivot[1]);
      g.beginPath();p.poly.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.restore();g.strokeStyle='red';g.stroke();
      g.fillStyle='yellow';g.beginPath();g.arc(p.to[0],p.to[1],3,0,7);g.fill();}
    g.restore();}}},
  async one(){heading('One');await tile(q.get('label')||'look',L(dolls[0],extra),{...opt,view:q.get('view')||'front'})}
};
/* ---------- view sheets ---------- */
const views=q.get('views')?q.get('views').split(','):['left','right','back'];
const vopt=(d,v,def)=>({zoom:zoom||def,scale:zoom?scale:(q.get('scale')?scale:1),grid,view:v,
  overlay:q.get('arm')&&dollView(d,v).arm?(g,sc)=>{g.strokeStyle='red';g.lineWidth=1/sc;g.beginPath();dollView(d,v).arm.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.stroke()}:null});
const fullBox=(d,v)=>v==='front'||v==='back'?[-30,-80,460,1000]:(d==='adult'?[-90,-80,360,1000]:[-80,-80,370,1000]);
const headBox=(d,v)=>v==='front'||v==='back'?(d==='adult'?[60,-60,280,420]:[40,-40,320,460]):(d==='adult'?[-50,-60,280,420]:[-60,-40,330,460]);
Object.assign(sheets,{
  async vout(){for(const d of dolls){heading('Outfits · '+d);for(const it of catalogOptions('outfit',d))if(want(it.id)){
    for(const v of views)await tile(it.id+' '+v,L(d,{outfit:it.id,shoes:q.get('shoes')||'none',necklace:'none',hair:q.get('hair')||'lab-none',earrings:'none',clip:'none',...extra}),vopt(d,v,fullBox(d,v)))}}},
  async vhair(){for(const d of dolls){heading('Hair · '+d);for(const it of CATALOG.itemList.filter(i=>i.category==='hair'&&i.id!=='lab-none'&&i.dolls.includes(d)))if(want(it.id)){
    for(const v of views)await tile(it.id+' '+v,L(d,{hair:it.id,...extra}),vopt(d,v,headBox(d,v)))}}},
  async vshoes(){for(const d of dolls){heading('Shoes · '+d);for(const id of ['none',...catalogOptions('shoes',d).map(i=>i.id)])if(want(id))for(const v of views)
    await tile(id+' '+v,L(d,{shoes:id,outfit:q.get('outfit')||defaultLook(d).outfit,...extra}),vopt(d,v,v==='back'||v==='front'?(d==='adult'?[80,700,240,190]:[70,690,260,190]):(d==='adult'?[-20,700,200,190]:[-20,690,230,190])))}},
  async vjewel(){for(const d of dolls){heading('Jewelry · '+d);
    for(const id of catalogOptions('earrings',d).map(i=>i.id))if(want(id))for(const t of tintOptions(id).length?tintOptions(id).slice(0,q.get('tints')?9:1):[original0])for(const v of views)
      await tile(id+' '+t.id+' '+v,L(d,{earrings:id,earringsTint:t.id,necklace:'none',clip:'none',hair:q.get('hair')||'ringlet-pigtails',...extra}),vopt(d,v,v==='back'?(d==='adult'?[100,40,200,150]:[80,80,250,170]):(d==='adult'?[20,40,160,150]:[0,80,190,170])));
    for(const id of catalogOptions('necklace',d).map(i=>i.id))if(want(id))for(const v of views)
      await tile(id+' '+v,L(d,{necklace:id,earrings:'none',clip:'none',hair:q.get('hair')||'curly-buns',...extra}),vopt(d,v,v==='back'?(d==='adult'?[110,100,180,170]:[100,150,200,170]):(d==='adult'?[10,100,170,170]:[0,150,200,170])));
  }},
  async vclips(){for(const d of dolls)for(const h of CATALOG.itemList.filter(i=>i.category==='hair'&&i.id!=='lab-none'&&i.dolls.includes(d)))if(want(h.id)){heading('Clips on '+h.id+' · '+d);
    for(const id of catalogOptions('clip',d).map(i=>i.id))for(const v of views)await tile(id+' '+v,L(d,{hair:h.id,clip:id,...extra}),{...vopt(d,v,headBox(d,v)),scale:zoom?scale:.6})}},
  async vcolors(){for(const d of dolls){heading('Hair colours per view · '+d);for(const h of (q.get('hair')||'long-waves,curly-bob').split(','))for(const hc of CATALOG.hairColors)for(const v of ['front',...views])
    await tile(h+' '+hc.id+' '+v,L(d,{hair:h,hairColor:hc.id,clip:'none',...extra}),{...vopt(d,v,headBox(d,v)),scale:.5})}},
  async vtints(){for(const d of dolls){heading('Tints per view · '+d);
    for(const cat of ['outfit','shoes'])for(const it of catalogOptions(cat,d))if(want(it.id))for(const t of it.tints)for(const v of ['front',...views])
      await tile(it.id+' · '+t.id+' '+v,L(d,{[cat]:it.id,[cat+'Tint']:t.id,...extra}),{...vopt(d,v,cat==='shoes'?(v==='front'||v==='back'?[80,700,240,190]:[-20,700,200,190]):fullBox(d,v)),scale:cat==='shoes'?.8:.3})}},
  async vmakeup(){for(const d of dolls){heading('Makeup per view · '+d);
    const looks=[{lips:'none',blush:'none',shadow:'none',gem:'none',nails:'none'},...(d==='adult'?[{lips:'cherry',blush:'berry',shadow:'aqua',gem:'heart',nails:'cherry'},{lips:'bubblegum',blush:'rose',shadow:'lilac',gem:'glitter',nails:'lilac'},{lips:'berry',blush:'peach',shadow:'gold',gem:'crystals',nails:'coral'},{gem:'star-freckles'},{gem:'butterfly'}]:[{lips:'cherry-gloss',blush:'rose',gem:'heart'},{lips:'strawberry-tint',blush:'peach',gem:'glitter'},{gem:'crystals'},{gem:'butterfly'},{gem:'star-freckles'}])];
    for(const m of looks)for(const v of ['front','left','right'])await tile(JSON.stringify(m)+' '+v,L(d,{hair:'curly-buns',clip:'none',earrings:'none',...m,...extra}),{...vopt(d,v,v==='front'?(d==='adult'?[140,50,130,100]:[115,90,180,120]):(d==='adult'?(v==='left'?[15,55,120,90]:[46,55,120,90]):(v==='left'?[0,90,140,110]:[67,90,140,110]))),scale:zoom?scale:2.4});
    if(d==='adult')for(const v of ['left','right'])await tile('nails cherry '+v,L(d,{nails:'cherry',shoes:'none',outfit:'black-flares-set',hair:'curly-buns'}),{...vopt(d,v,v==='left'?[30,480,90,80]:[61,480,90,80]),scale:3});
  }},
  async turn(){heading('Turnarounds');const looks=JSON.parse(q.get('looks')||'null')||[
      L('adult'),L('little'),
      L('adult',{outfit:'lilac-satin-bow-dress',hair:'half-up-curls',hairColor:'honey',shoes:'lilac-mary-jane-heels',necklace:'butterfly-necklace',clip:'butterfly-clip',lips:'bubblegum',shadow:'pink',gem:'glitter',nails:'bubblegum'}),
      L('little',{outfit:'denim-overalls',hair:'curly-buns',shoes:'white-velcro-sneakers',clip:'none',gem:'heart',blush:'peach'}),
      L('adult',{outfit:'denim-jacket-skirt',hair:'side-ponytail',hairColor:'bubblegum',shoes:'pink-chunky-sneakers',earrings:'star-studs',necklace:'none',clip:'gold-star',lips:'cherry',shadow:'lilac'}),
      L('little',{outfit:'star-pajamas',hair:'curly-bob',hairColor:'strawberry',shoes:'strawberry-rain-boots',clip:'butterfly-clip',lips:'strawberry-tint',gem:'star-freckles'}),
      L('adult',{outfit:'black-flares-set',hair:'curly-bob',hairColor:'jet',shoes:'black-platform-sandals',earrings:'gold-hoops',earringsTint:'silver',clip:'red-bow',lips:'berry',shadow:'bronze'}),
      L('little',{outfit:'mint-cardigan-dress',hair:'curly-bob',hairColor:'honey',shoes:'red-mary-janes',clip:'hibiscus-clip',gem:'glitter'}),
      L('adult',{outfit:'pink-velour-cargo',outfitTint:'lilac',hair:'ringlet-pigtails',hairColor:'lilac',shoes:'pink-chunky-sneakers',clip:'peach-blossom',gem:'crystals',lips:'peach-gloss',shadow:'aqua'}),
      L('little',{outfit:'lilac-cord-pinafore',hair:'curly-buns',shoes:'white-velcro-sneakers',clip:'satin-bow',earrings:'pearl-studs',gem:'butterfly'}),
      L('adult',{outfit:'green-hibiscus-sundress',hair:'long-waves',hairColor:'chestnut',shoes:'lilac-mary-jane-heels',necklace:'butterfly-necklace',earrings:'heart-studs',clip:'hibiscus-clip',lips:'rose-nude',blush:'rose'}),
      L('little',{outfit:'pink-gingham-bow-dress',hair:'ringlet-pigtails',shoes:'red-mary-janes',clip:'red-bow',necklace:'pearl-starfish-necklace'})];
    const order=['front','left','back','right'];
    for(const look of looks){const row=document.createElement('canvas');const sc=Number(q.get('scale')||.42);row.width=Math.round(600*4*sc);row.height=Math.round(1060*sc);
      const g=row.getContext('2d');g.fillStyle='#cfe6d4';g.fillRect(0,0,row.width,row.height);
      for(const [i,v] of order.entries()){const c=await composeDoll(look,v);g.drawImage(c,i*600*sc,0,600*sc,1060*sc)}
      g.strokeStyle='rgba(255,0,0,.6)';g.beginPath();g.moveTo(0,DOLL_CANVAS.baseline*sc+.5);g.lineTo(row.width,DOLL_CANVAS.baseline*sc+.5);g.stroke();
      const f=document.createElement('figure');const cap=document.createElement('figcaption');cap.textContent=look.doll+' '+look.outfit+' '+look.hair+' · '+order.join(' / ');f.append(row,cap);section.append(f)}},
  /* heads: every hair style (and the bald base, hair=lab-none) zoomed on the skull in all four views,
     to judge hairlines. hair=a,b picks styles; views= picks views; colors=a,b|all repeats each style
     in those hair colours; scale= overrides the zoom. */
  async heads(){const box={adult:{front:[120,-70,160,230],back:[120,-70,160,230],left:[0,-70,190,230],right:[-9,-70,190,230]},
      little:{front:[95,-80,210,280],back:[95,-80,210,280],left:[-15,-80,240,280],right:[-18,-80,240,280]}};
    const hv=q.get('views')?views:CATALOG.views,styles=(q.get('hair')||'lab-none,'+CATALOG.itemList.filter(i=>i.category==='hair'&&i.id!=='lab-none').map(i=>i.id).join(',')).split(',');
    const colors=q.get('colors')?(q.get('colors')==='all'?CATALOG.hairColors.map(c=>c.id):q.get('colors').split(',')):[null];
    for(const d of dolls){heading('Heads · '+d);for(const h of styles.filter(h=>catalogItem(h)?.dolls.includes(d)))for(const c of colors)for(const v of hv)
      await tile(h+' '+(c?c+' ':'')+v,L(d,{hair:h,clip:'none',earrings:'none',necklace:'none',...(c?{hairColor:c}:{}),...extra}),{zoom:box[d][v],scale:q.get('scale')?scale:(d==='adult'?1.6:1.2),grid,view:v})}},
  /* proofs: each style on its doll next to its worn proof (art/proofs/pack2), the proof mapped into
     doll space by the registration (art/fit_hair_pack2.py), so both tiles show the same head box.
     Per view: the doll at game size (game=k, default .75), the head zoomed, the proof zoomed.
     hair=a,b; views=; colors=a,b|all; zoom-scale via scale=. bald=1 adds the bald base. */
  async proofs(){
    const reg=(await (await fetch('/art/proofs/pack2/hair-registration.json')).json()).items;
    const box={adult:{front:[110,-70,180,280],back:[110,-70,180,280],left:[-10,-70,200,280],right:[-19,-70,200,280]},
      little:{front:[85,-80,236,330],back:[85,-80,236,330],left:[-25,-80,260,330],right:[-28,-80,260,330]}};
    const hv=q.get('views')?views:CATALOG.views,gk=Number(q.get('game')||.75);
    const colors=q.get('colors')?(q.get('colors')==='all'?CATALOG.hairColors.map(c=>c.id):q.get('colors').split(',')):[null];
    const styles=(q.get('hair')||CATALOG.itemList.filter(i=>i.category==='hair'&&i.id!=='lab-none').map(i=>i.id).join(',')).split(',');
    for(const d of dolls)for(const h of styles.filter(h=>catalogItem(h)?.dolls.includes(d))){heading(h+' · '+d);
      for(const c of colors)for(const v of hv){
        const look=L(d,{hair:h,clip:'none',earrings:'none',necklace:'none',...(c?{hairColor:c}:{}),...extra}),sc=q.get('scale')?scale:(d==='adult'?1.6:1.3);
        await tile(h+' '+(c||'')+' '+v+' game',look,{zoom:fullBox(d,v).map((n,i)=>i===3?560:n),scale:gk,view:v});
        await tile(h+' '+(c||'')+' '+v,look,{zoom:box[d][v],scale:sc,view:v});
        const r=reg[h]?.[v];if(!r||c&&c!==colors[0])continue;
        const img=new Image();img.src='/art/proofs/pack2/hair/'+h+'-'+v+'.webp';await img.decode();
        const [x,y,w,hh]=box[d][v],t=document.createElement('canvas');t.width=Math.round(w*sc);t.height=Math.round(hh*sc);
        const g=t.getContext('2d');g.fillStyle='#cfe6d4';g.fillRect(0,0,t.width,t.height);g.scale(sc,sc);g.translate(-x,-y);
        g.translate(r.tx,r.ty);g.rotate(r.rot*Math.PI/180);g.scale(r.s,r.s);g.imageSmoothingQuality='high';g.drawImage(img,0,0);
        const f=document.createElement('figure'),cap=document.createElement('figcaption');cap.textContent='proof '+h+' '+v;cap.style.width=t.width-10+'px';f.append(t,cap);section.append(f);
      }}},
  /* faceopen: per style, the share of the face region (CATALOG.faceOpen, front view) that the hair in
     front of the face leaves uncovered, plus the face zoomed with the region outlined. window.faceOpen =
     [{doll, hair, open, eyes}] (open: whole region; eyes: the eye band alone), used by
     test/face-open.test.mjs. tiles=0 skips the pictures. */
  async faceopen(){
    const res=[];window.faceOpen=res;
    const eyeBand={adult:[78,94],little:[112,132]};
    for(const d of dolls){heading('Face open · '+d);
      const rows=CATALOG.faceOpen[d],[ox,oy]=dollView(d,'front').origin;
      for(const it of CATALOG.itemList.filter(i=>i.category==='hair'&&i.id!=='lab-none'&&i.dolls.includes(d))){if(!want(it.id))continue;
        const layers=await composeDollLayers({...L(d,{hair:it.id,clip:'none',earrings:'none',necklace:'none'}),doll:d},'front');
        const hair=layers.layers.filter(l=>l.kind==='hairFront').map(l=>l.canvas);
        const m=makeCanvas(DOLL_CANVAS.width,DOLL_CANVAS.height),mg=m.getContext('2d');hair.forEach(c=>mg.drawImage(c,0,0));
        const md=mg.getImageData(0,0,m.width,m.height).data;
        const reg=makeCanvas(m.width,m.height),rg=reg.getContext('2d');rg.translate(ox,oy);rg.beginPath();
        rows.forEach(([y,l])=>rg.lineTo(l,y));[...rows].reverse().forEach(([y,,r])=>rg.lineTo(r,y));rg.closePath();rg.fill();
        const rd=rg.getImageData(0,0,m.width,m.height).data;
        let n=0,cov=0,en=0,ec=0;
        for(let i=3;i<rd.length;i+=4)if(rd[i]>128){n++;const c=md[i]>128;if(c)cov++;const y=((i>>2)/m.width|0)-oy;if(y>=eyeBand[d][0]&&y<=eyeBand[d][1]){en++;if(c)ec++}}
        // halo: rows from the temple to the jaw, each side: background between her silhouette and the
        // hair lying within a few px outside it (a pale band, not a genuine open gap); px per row and side
        const all=makeCanvas(m.width,m.height),alg=all.getContext('2d');layers.layers.forEach(l=>alg.drawImage(l.canvas,0,0));
        const ad=alg.getImageData(0,0,m.width,m.height).data,W=m.width,UR={adult:[70,150],little:[110,200]}[d];
        const bodyA=layers.layers.find(l=>l.kind==='body').canvas.getContext('2d').getImageData(0,0,W,m.height).data;
        let gapPx=0,rowsN=0;
        for(let y=UR[0];y<=UR[1];y++){const Y=Math.round(y+oy);let l=-1,r=-1;for(let x=0;x<W;x++)if(bodyA[(Y*W+x)*4+3]>128){if(l<0)l=x;r=x}
          if(l<0)continue;rowsN++;
          for(const [s0,dir] of [[l-1,-1],[r+1,1]]){let k=0;while(k<10&&ad[(Y*W+s0+dir*k)*4+3]<128)k++;if(k>0&&k<10)gapPx+=k}}
        // temple: the same from the hairline to the top of the ear (every style: the hair meets her temple)
        let tPx=0,tRows=0;const TR={adult:[30,80],little:[62,108]}[d];
        for(let y=TR[0];y<=TR[1];y++){const Y=Math.round(y+oy);let l=-1,r=-1;for(let x=0;x<W;x++)if(bodyA[(Y*W+x)*4+3]>128){if(l<0)l=x;r=x}
          if(l<0)continue;tRows++;
          for(const [s0,dir] of [[l-1,-1],[r+1,1]]){let k=0;while(k<10&&ad[(Y*W+s0+dir*k)*4+3]<128)k++;if(k>0&&k<10)tPx+=k}}
        res.push({doll:d,hair:it.id,open:1-cov/n,eyes:1-ec/en,halo:gapPx/(2*rowsN),temple:tPx/(2*tRows),earsCovered:!!it.fit[d].front.earsUnder});
        if(q.get('tiles')!=='0')await tile(`${it.id} open ${(100*(1-cov/n)).toFixed(1)}% eyes ${(100*(1-ec/en)).toFixed(1)}% halo ${res[res.length-1].halo.toFixed(2)}px temple ${res[res.length-1].temple.toFixed(2)}px`,L(d,{hair:it.id,clip:'none',earrings:'none',necklace:'none',...extra}),
          {zoom:d==='adult'?[110,-30,180,230]:[90,-20,230,270],scale:Number(q.get('scale')||1.4),overlay:q.get('outline')?(g,sc)=>{g.strokeStyle='rgba(0,140,255,.8)';g.lineWidth=1/sc;g.beginPath();rows.forEach(([y,l])=>g.lineTo(l,y));[...rows].reverse().forEach(([y,,r])=>g.lineTo(r,y));g.closePath();g.stroke()}:null});
      }}},
  async portraits(){heading('paintPortrait per view');for(const d of dolls)for(const v of CATALOG.views){const c=document.createElement('canvas');await paintPortrait(c,L(d,{backdrop:Number(q.get('bd')||0),...extra}),q.get('postcard')==='1',v);c.style.width=(c.width*scale)+'px';const f=document.createElement('figure');const cap=document.createElement('figcaption');cap.textContent=d+' '+v;f.append(c,cap);section.append(f)}}
});
/* ---------- accessories (art/fit_acc.py) ----------
   acc: every hat, pair of glasses, bag and toy on its doll in all four views (cats=hat,glasses,...;
   hair= the style worn, default her default; outfit=). acchair: hats and glasses (cats=) against every
   hairstyle of the doll, front and left (views=). */
Object.assign(sheets,{
  async acc(){const cats=(q.get('cats')||'hat,glasses,bag,toy').split(',');
    for(const d of dolls)for(const cat of cats){const its=catalogOptions(cat,d);if(!its.length)continue;heading(cat+' · '+d);
      const head=cat==='hat'||cat==='glasses';
      for(const it of its)if(want(it.id))for(const v of q.get('views')?views:CATALOG.views)
        await tile(it.id+' '+v,L(d,{[cat]:it.id,hair:q.get('hair')||defaultLook(d).hair,...(q.get('outfit')?{outfit:q.get('outfit')}:{}),...extra}),
          {view:v,zoom:zoom||(head?headBox(d,v):fullBox(d,v)),scale:zoom?scale:(head?1:.5),grid})}},
  async acchair(){const cats=(q.get('cats')||'hat,glasses').split(','),hv=q.get('views')?views:['front','left'];
    for(const d of dolls)for(const cat of cats)for(const it of catalogOptions(cat,d))if(want(it.id)){heading(it.id+' · '+d);
      for(const h of CATALOG.hairStyles[d])for(const v of hv)
        await tile(h+' '+v,L(d,{[cat]:it.id,hair:h,...extra}),{view:v,zoom:zoom||headBox(d,v),scale:zoom?scale:.7,grid})}}
});
const original0={id:'original'};
(async()=>{try{await sheets[sheetName]()}catch(e){console.error(e);const p=document.createElement('pre');p.textContent=e.stack;out.append(p)}window.labDone=true})();
</script>
